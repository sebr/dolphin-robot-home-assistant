[project]
name = "dolphin-robot-home-assistant"
version = "1.0.26"
description = "Home Assistant custom integration for Maytronics Dolphin pool cleaners (MyDolphin Plus)"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "aiofiles",
    "awsiotsdk",
    "colorlog==6.10.1",
    "homeassistant==2026.1.0",
    "pycares<5.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff==0.15.14",
]

[tool.uv]
package = false
